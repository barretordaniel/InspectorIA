services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inspectoria
      POSTGRES_USER: inspectoria
      POSTGRES_PASSWORD: inspectoria
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectoria"]
      interval: 3s
      retries: 20

  app:                       # web + API en un solo servicio
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/inspectoria
      INSPECTORIA_STORAGE_DIR: /data/uploads
    volumes: [uploads:/data/uploads]

volumes:
  pgdata:
  uploads:
