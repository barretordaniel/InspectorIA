spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inspectoria
    username: inspectoria
    password: inspectoria
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 10MB
inspectoria:
  storage-dir: ./uploads
  cors-origin: http://localhost:5173
  classifier: ${CLASSIFIER:simulated}   # simulated | remote (YOLOv8, ver ai-service/README.md)
  ai:
    url: ${AI_URL:http://localhost:8000}
  seed-demo: true            # crea 8 reportes de ejemplo si la tabla está vacía (desactivar en producción)
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-de-desarrollo-minimo-32-bytes}
    ttl-hours: 8
  admin:                     # usuario institucional inicial
    email: ${ADMIN_EMAIL:admin@inspectoria.co}
    password: ${ADMIN_PASSWORD:inspectoria2026}
    name: Entidad demo
